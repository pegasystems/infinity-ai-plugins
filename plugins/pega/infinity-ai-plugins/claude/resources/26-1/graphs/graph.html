<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Knowledge Graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; }
#app { display: flex; height: 100vh; }
#sidebar { width: 320px; min-width: 320px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; }
#sidebar h1 { font-size: 1.1rem; padding: 16px; border-bottom: 1px solid #30363d; color: #58a6ff; }
#search-box { margin: 12px; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 0.9rem; outline: none; }
#search-box:focus { border-color: #58a6ff; }
#controls { padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
#controls button { padding: 4px 10px; background: #21262d; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 0.78rem; cursor: pointer; }
#controls button:hover { background: #30363d; }
#controls button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
#legend { padding: 12px; overflow-y: auto; flex: 1; }
.legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 0.82rem; }
.legend-item:hover { color: #58a6ff; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
#detail { padding: 12px; border-top: 1px solid #30363d; max-height: 35%; overflow-y: auto; font-size: 0.82rem; }
#detail h3 { color: #58a6ff; margin-bottom: 6px; font-size: 0.9rem; }
#detail .label { color: #8b949e; }
#detail .value { color: #c9d1d9; }
#detail .concepts { margin-top: 4px; }
#detail .concept-tag { display: inline-block; background: #1f6feb22; border: 1px solid #1f6feb44; color: #58a6ff; padding: 1px 6px; border-radius: 3px; font-size: 0.75rem; margin: 2px; }
#graph { flex: 1; position: relative; }
svg { width: 100%; height: 100%; }
.edge { stroke-opacity: 0.2; stroke-width: 1; }
.edge.highlighted { stroke-opacity: 0.7; stroke-width: 2; }
.edge.structural { stroke-dasharray: 4,3; }
.node-circle { stroke-width: 1.5; cursor: pointer; transition: r 0.15s; }
.node-circle:hover { filter: brightness(1.3); }
.node-label { fill: #8b949e; font-size: 9px; pointer-events: none; text-anchor: middle; }
.node-label.visible { fill: #c9d1d9; font-size: 10px; }
.dimmed { opacity: 0.08; }
.stats { position: absolute; bottom: 12px; right: 16px; font-size: 0.75rem; color: #484f58; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Skills Knowledge Graph</h1>
    <input id="search-box" type="text" placeholder="Search skills or concepts..." autocomplete="off" />
    <div id="controls">
      <button id="btn-reset" title="Reset view">Reset</button>
      <button id="btn-explicit" title="Toggle edge visibility">Edges</button>
      <button id="btn-labels" title="Toggle labels">Labels</button>
      <button id="btn-hubs" title="Highlight hub nodes">Hubs</button>
    </div>
    <div id="legend"></div>
    <div id="detail">
      <p style="color:#484f58">Click a node to see details</p>
    </div>
  </div>
  <div id="graph">
    <svg id="graph-svg"></svg>
    <div class="stats" id="stats"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>

"},{"source":"rules-rule-ui-view/references/property-first-view-authoring","target":"rules-rule-ui-view/references/view-template-patterns","relation":"REFERENCES","confidence":"EXTRACTED"},{"source":"rules-rule-ui-view/references/view-template-patterns","target":"methodology-explain-application","relation":"REFERENCES","confidence":"EXTRACTED"},{"source":"rules-rule-ui-view/references/view-update-workflow","target":"rules-rule-classmetadata/examples/with-primary-fields","relation":"REQUIRES","confidence":"EXTRACTED"},{"source":"rules-rule-ui-view/references/view-update-workflow","target":"rules-rule-ui-view/examples/append/dropdown-field","relation":"REFERENCES","confidence":"EXTRACTED"},{"source":"rules-rule-ui-view/references/view-update-workflow","target":"rules-rule-ui-view/examples/pxViewMetadata/dropdown","relation":"REFERENCES","confidence":"EXTRACTED"},{"source":"rules-rule-ui-view/references/view-update-workflow","target":"rules-rule-ui-view/examples/pyContent/dropdown","relation":"REFERENCES","confidence":"EXTRACTED"},{"source":"rules-rule-ui-view/references/view-update-workflow","target":"rules-rule-ui-view/references/case-view-architecture","relation":"REFERENCES","confidence":"EXTRACTED"}],"communities":{"0":{"id":0,"size":117,"label":"data-model, validation, branching","color":"#3498DB"},"1":{"id":1,"size":105,"label":"security, data-model, ui-views","color":"#2ECC71"},"2":{"id":2,"size":96,"label":"reporting, data-model, automation","color":"#E74C3C"},"3":{"id":3,"size":76,"label":"testing, case-lifecycle, data-model","color":"#9B59B6"},"4":{"id":4,"size":72,"label":"correspondence, data-model, case-lifecycle","color":"#F39C12"},"5":{"id":5,"size":70,"label":"sla, case-lifecycle, ui-views","color":"#1ABC9C"},"6":{"id":6,"size":57,"label":"automation, case-lifecycle, data-model","color":"#E67E22"},"7":{"id":7,"size":36,"label":"automation, case-lifecycle, ui-views","color":"#16A085"},"8":{"id":8,"size":29,"label":"genai, ui-views, data-model","color":"#2E86C1"},"9":{"id":9,"size":24,"label":"automation, case-lifecycle, data-model","color":"#28B463"},"10":{"id":10,"size":21,"label":"integration, automation, data-model","color":"#AF7AC5"},"11":{"id":11,"size":19,"label":"case-lifecycle, decision-logic, ui-views","color":"#D35400"},"12":{"id":12,"size":18,"label":"automation, case-lifecycle, data-model","color":"#34495E"},"13":{"id":13,"size":17,"label":"integration, data-model, case-lifecycle","color":"#C0392B"},"14":{"id":14,"size":16,"label":"data-model, genai, integration","color":"#7D3C98"},"15":{"id":15,"size":13,"label":"automation, case-lifecycle, data-model","color":"#2471A3"},"16":{"id":16,"size":10,"label":"genai, data-model, integration","color":"#229954"},"17":{"id":17,"size":10,"label":"decision-logic, data-model, ui-views","color":"#CA6F1E"},"18":{"id":18,"size":9,"label":"data-model, case-lifecycle, ui-views","color":"#A93226"},"19":{"id":19,"size":8,"label":"data-model, ui-views, case-lifecycle","color":"#1A5276"},"20":{"id":20,"size":8,"label":"automation, ui-views, case-lifecycle","color":"#3498DB"},"21":{"id":21,"size":7,"label":"branching, ui-views, data-model","color":"#2ECC71"},"22":{"id":22,"size":5,"label":"decision-logic, integration, ui-views","color":"#E74C3C"},"23":{"id":23,"size":5,"label":"automation, integration, case-lifecycle","color":"#9B59B6"},"24":{"id":24,"size":3,"label":"branching, case-lifecycle","color":"#F39C12"},"25":{"id":25,"size":3,"label":"branching","color":"#1ABC9C"},"26":{"id":26,"size":2,"label":"integration, automation, branching","color":"#E67E22"}},"godNodes":["rules-rule-ui-view","rules-rule-obj-activity","methodology-rule-authoring","library-function-builder","rules-rule-obj-flow","rules-rule-ui-view/references/field-type-selection","rules-rule-obj-casetype","rules-rule-test-unit-case","rules-rule-declare-pages","rules-rule-obj-property"]};

const svg = d3.select("#graph-svg");
const width = document.getElementById("graph").clientWidth;
const height = document.getElementById("graph").clientHeight;
svg.attr("viewBox", [0, 0, width, height]);

// State
let showEdges = true;
let showLabels = true;
let highlightedComm = null;
let selectedNode = null;

// Community colors
const commColors = {};
Object.values(DATA.communities).forEach(c => { commColors[c.id] = c.color; });
const getColor = (d) => commColors[d.community] || "#484f58";

// Build simulation data
const nodeMap = new Map(DATA.nodes.map(n => [n.id, n]));
const simNodes = DATA.nodes.map(d => ({...d}));
const simEdges = DATA.edges.map(d => ({source: d.source, target: d.target, relation: d.relation, confidence: d.confidence}));

// Degree-based radius
const maxDeg = Math.max(1, ...simNodes.map(n => n.degree));
const radius = (d) => Math.max(3, 3 + Math.sqrt(d.degree / maxDeg) * 14);

// Force simulation
const sim = d3.forceSimulation(simNodes)
  .force("link", d3.forceLink(simEdges).id(d => d.id).distance(80).strength(0.3))
  .force("charge", d3.forceManyBody().strength(-60).distanceMax(400))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => radius(d) + 2))
  .alphaDecay(0.02);

// Zoom
const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);

// Edges
const edgeG = g.append("g").attr("class", "edges");
const edgeEls = edgeG.selectAll("line")
  .data(simEdges).join("line")
  .attr("class", d => "edge" + (d.relation === "CONTAINS" ? " structural" : ""))
  .attr("stroke", d => {
    if (d.relation === "REQUIRES") return "#e74c3c";
    if (d.relation === "CONTAINS") return "#30363d";
    return "#30363d";
  });

// Nodes
const nodeG = g.append("g").attr("class", "nodes");
const nodeEls = nodeG.selectAll("circle")
  .data(simNodes).join("circle")
  .attr("class", "node-circle")
  .attr("r", d => radius(d))
  .attr("fill", d => getColor(d))
  .attr("stroke", d => d3.color(getColor(d)).darker(0.5))
  .on("click", (ev, d) => selectNode(d))
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

nodeEls.append("title").text(d => d.id + (d.description ? "\n" + d.description : ""));

// Labels
const labelEls = nodeG.selectAll("text")
  .data(simNodes).join("text")
  .attr("class", d => "node-label" + (d.degree > maxDeg * 0.3 ? " visible" : ""))
  .attr("dy", d => radius(d) + 12)
  .text(d => d.label);

// Tick
sim.on("tick", () => {
  edgeEls
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeEls.attr("cx", d => d.x).attr("cy", d => d.y);
  labelEls.attr("x", d => d.x).attr("y", d => d.y);
});

// Stats
document.getElementById("stats").textContent =
  `${DATA.nodes.length} nodes · ${DATA.edges.length} explicit edges · ${Object.keys(DATA.communities).length} communities`;

// Legend
const legend = document.getElementById("legend");
Object.values(DATA.communities)
  .sort((a, b) => b.size - a.size)
  .forEach(c => {
    const el = document.createElement("div");
    el.className = "legend-item";
    el.innerHTML = `<span class="legend-dot" style="background:${c.color}"></span>C${c.id}: ${c.label} (${c.size})`;
    el.onclick = () => filterCommunity(c.id);
    legend.appendChild(el);
  });

// Interactions
function selectNode(d) {
  selectedNode = d;
  // Find neighbors
  const neighborIds = new Set();
  simEdges.forEach(e => {
    const src = typeof e.source === "object" ? e.source.id : e.source;
    const tgt = typeof e.target === "object" ? e.target.id : e.target;
    if (src === d.id) neighborIds.add(tgt);
    if (tgt === d.id) neighborIds.add(src);
  });
  neighborIds.add(d.id);

  nodeEls.classed("dimmed", n => !neighborIds.has(n.id));
  edgeEls.classed("dimmed", e => {
    const src = typeof e.source === "object" ? e.source.id : e.source;
    const tgt = typeof e.target === "object" ? e.target.id : e.target;
    return !neighborIds.has(src) || !neighborIds.has(tgt);
  });
  edgeEls.classed("highlighted", e => {
    const src = typeof e.source === "object" ? e.source.id : e.source;
    const tgt = typeof e.target === "object" ? e.target.id : e.target;
    return (src === d.id || tgt === d.id);
  });
  labelEls.classed("dimmed", n => !neighborIds.has(n.id))
    .classed("visible", n => neighborIds.has(n.id));

  // Detail panel
  const detail = document.getElementById("detail");
  const concepts = (d.concepts || []).map(c => `<span class="concept-tag">${c}</span>`).join("");
  detail.innerHTML = `
    <h3>${esc(d.id)}</h3>
    <p><span class="label">Category:</span> <span class="value">${esc(d.category)}</span></p>
    <p><span class="label">Community:</span> <span class="value">C${d.community}</span></p>
    <p><span class="label">Connections:</span> <span class="value">${d.degree}</span></p>
    ${d.description ? '<p><span class="label">Description:</span> <span class="value">' + esc(d.description) + '</span></p>' : ''}
    ${concepts ? '<div class="concepts">' + concepts + '</div>' : ''}
    <p style="margin-top:8px;color:#484f58">Click background to reset</p>
  `;
}

function filterCommunity(cid) {
  if (highlightedComm === cid) {
    highlightedComm = null;
    resetHighlights();
    return;
  }
  highlightedComm = cid;
  nodeEls.classed("dimmed", n => n.community !== cid);
  edgeEls.classed("dimmed", () => true);
  labelEls.classed("dimmed", n => n.community !== cid)
    .classed("visible", n => n.community === cid);
}

function resetHighlights() {
  highlightedComm = null;
  selectedNode = null;
  nodeEls.classed("dimmed", false);
  edgeEls.classed("dimmed", false).classed("highlighted", false);
  labelEls.classed("dimmed", false).classed("visible", d => d.degree > maxDeg * 0.3);
  document.getElementById("detail").innerHTML = '<p style="color:#484f58">Click a node to see details</p>';
}

svg.on("click", (e) => {
  if (e.target === svg.node()) resetHighlights();
});

// Search
document.getElementById("search-box").addEventListener("input", function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { resetHighlights(); return; }
  const matches = new Set();
  simNodes.forEach(n => {
    if (n.id.toLowerCase().includes(q) || n.label.toLowerCase().includes(q) ||
        (n.concepts || []).some(c => c.toLowerCase().includes(q)) ||
        (n.description || "").toLowerCase().includes(q)) {
      matches.add(n.id);
    }
  });
  nodeEls.classed("dimmed", n => !matches.has(n.id));
  edgeEls.classed("dimmed", () => true);
  labelEls.classed("dimmed", n => !matches.has(n.id))
    .classed("visible", n => matches.has(n.id));
});

// Buttons
document.getElementById("btn-reset").onclick = () => {
  resetHighlights();
  document.getElementById("search-box").value = "";
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
};
document.getElementById("btn-explicit").onclick = function() {
  showEdges = !showEdges;
  this.classList.toggle("active", showEdges);
  edgeG.style("display", showEdges ? null : "none");
};
document.getElementById("btn-labels").onclick = function() {
  showLabels = !showLabels;
  this.classList.toggle("active", showLabels);
  labelEls.style("display", showLabels ? null : "none");
};
document.getElementById("btn-hubs").onclick = function() {
  const hubSet = new Set(DATA.godNodes);
  if (this.classList.contains("active")) {
    this.classList.remove("active");
    resetHighlights();
  } else {
    this.classList.add("active");
    nodeEls.classed("dimmed", n => !hubSet.has(n.id));
    edgeEls.classed("dimmed", () => true);
    labelEls.classed("dimmed", n => !hubSet.has(n.id))
      .classed("visible", n => hubSet.has(n.id));
  }
};

// Initialize edge button as active
document.getElementById("btn-explicit").classList.add("active");
document.getElementById("btn-labels").classList.add("active");

function esc(s) { const el = document.createElement("span"); el.textContent = s; return el.innerHTML; }
</script>
</body>
